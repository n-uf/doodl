name: Release

# Calendar versions (YY.M.R, _agent/versioning-policy.md), one version for all
# four packages: @n-uf/doodl, doodl-react, doodl-react-pdf and doodl-go. A
# release PR bumps every packages/*/package.json with `pnpm version:bump` and
# adds CHANGELOG entries; merging it to main (usually the develop -> main
# promotion) publishes that version to npmjs (public, with provenance) and to
# GitHub Packages, tags it v<version> and notifies finfactory/pdf-n-uf.
#
# When it runs:
# - a push to main that changes a packages/*/package.json;
# - "Run workflow" on main (workflow_dispatch). To retry a failed release,
#   prefer "Re-run all jobs" on its run: that rebuilds the bump commit, where
#   "Run workflow" builds main's head (maybe a later promotion);
# - a pull request that touches the release machinery: a dry run, the build
#   job only (check, build, pack), nothing published.
#
# What a run publishes is the manifests' version, wherever it is new: per
# package and registry, only if it's missing there and not older than that
# registry's `latest` (an older version would move `latest` back to it). So
# re-runs are safe, and a manifest change that leaves the version at a
# published one (a dependency, a script) publishes nothing.
#
# Two jobs, so npm's publish identity never meets third-party code:
#   build    no secrets, read-only token, no dependency cache (main's cache is
#            written by every CI run). Installs, checks, builds and packs the
#            four packages with pnpm (which turns `workspace:*` into the
#            version), then uploads the tarballs as the artifact `packages`
#            (kept 1 day). Their checksum is a job output, computed before the
#            upload: a later step (an action's post step, a leftover process)
#            can replace the artifact, but it can't change an earlier step's
#            output. It does not vouch for the build itself: code that runs
#            during the install or build shapes the tarballs either way.
#   publish  main only, after build passed, in the `npm` environment. The only
#            job with id-token: write, packages: write and contents: write, and
#            it runs no install, no build and no package scripts: first-party
#            actions, jq, git and npm. It checks the downloaded tarballs against
#            build's checksum and publishes those same files to both
#            registries, dependencies first: npmjs first, so a refusal there (a
#            trusted publisher missing, an OIDC hiccup) leaves GitHub Packages
#            untouched and a re-run carries on where it stopped; then GitHub
#            Packages, the tag and the pdf-n-uf notice.
# Both jobs check out the commit the run started on (github.sha), the commit
# the npm provenance names.
#
# Credentials:
# - npmjs: trusted publishing, no stored token. npm swaps the publish job's
#   GitHub OIDC token for a one-time publish token, as set up on npmjs.com for
#   each of the four packages (Trusted Publisher: GitHub Actions, n-uf/doodl,
#   release.yml, environment `npm`; `npm trust github`). The `npm` environment
#   lets only main deploy (a deployment branch rule), so an edited copy of this
#   file on another branch, a pull request run, or an older commit's workflow
#   (the tag-triggered one this file replaced) can't get an OIDC token npm
#   accepts. It needs npm 11.5.1+ (Node 22 ships npm 10, so the job installs
#   npm 11). Provenance comes with it.
# - GITHUB_TOKEN: publishes to GitHub Packages and pushes the tag.
# - DISPATCH_TOKEN (optional): sends pdf-n-uf the lib-released notice.

on:
  push:
    branches: [main]
    paths:
      - packages/*/package.json
  pull_request:
    paths:
      - .github/workflows/release.yml
      - packages/*/package.json
      - scripts/calendar-version-bump.mjs
  workflow_dispatch:

concurrency:
  # Dry runs (pull requests) never queue behind or cancel a release.
  group: ${{ github.event_name == 'pull_request' && format('release-dry-run-{0}', github.ref) || 'release' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# bash -eo pipefail (a bare `run:` gets bash -e only)
defaults:
  run:
    shell: bash

env:
  # Dependencies first
  PACKAGES: doodl doodl-react doodl-react-pdf doodl-go

jobs:
  build:
    name: Check, build and pack
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sum: ${{ steps.pack.outputs.sum }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      # No `cache: pnpm`: the release builds from a fresh store (see the header)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build, check types, test
        run: |
          pnpm build:packages
          pnpm typecheck
          pnpm test

      - name: Pack
        id: pack
        run: |
          version=$(jq -r .version packages/doodl/package.json)
          dest="$RUNNER_TEMP/packages"
          mkdir -p "$dest"
          for name in $PACKAGES; do
            got=$(jq -r '.name + "@" + .version' "packages/$name/package.json")
            if [ "$got" != "@n-uf/$name@$version" ]; then
              echo "::error::packages/$name is $got; all four packages must be at $version."
              exit 1
            fi
            # pnpm pack, not npm pack: it writes the version over `workspace:*`
            (cd "packages/$name" && pnpm pack --pack-destination "$dest")
            tarball="$dest/n-uf-$name-$version.tgz"
            manifest=$(tar -xOzf "$tarball" package/package.json)
            if grep -q '"workspace:' <<< "$manifest"; then
              echo "::error::$tarball still has a workspace: dependency."
              exit 1
            fi
            tar -tzf "$tarball"
          done
          # The four tarballs above and nothing else
          if [ "$(find "$dest" -mindepth 1 | wc -l)" -ne 4 ]; then
            echo "::error::Expected 4 files in $dest, found: $(find "$dest" -mindepth 1)"
            exit 1
          fi
          cd "$dest"
          echo "sum=$(sha256sum ./*.tgz | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: packages
          path: ${{ runner.temp }}/packages/*.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish the version where it's new
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    # The npm trusted publishers name this environment; only main may use it
    environment: npm
    runs-on: ubuntu-latest
    permissions:
      contents: write # the v<version> tag
      packages: write # GitHub Packages
      id-token: write # npm trusted publishing (OIDC) and provenance
    env:
      NPMJS: https://registry.npmjs.org
      GHPKG: https://npm.pkg.github.com
      HAS_DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: packages
          path: ${{ runner.temp }}/packages

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@n-uf"

      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10
      - name: npm 11
        run: |
          npm install -g npm@11.20.0
          npm --version

      - name: Version
        id: version
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_SUM: ${{ needs.build.outputs.sum }}
        run: |
          version=$(jq -r .version packages/doodl/package.json)
          # Here-strings, not `echo | grep -q`: with pipefail, grep quitting
          # early can fail the pipeline through echo's SIGPIPE.
          if ! grep -qE '^[0-9]{2}\.([1-9]|1[0-2])\.[0-9]+$' <<< "$version"; then
            echo "::error::$version is not a calendar version (YY.M.R)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

          # The tarballs are the ones build packed
          dir="$RUNNER_TEMP/packages"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          sum=$(cd "$dir" && sha256sum ./*.tgz | sha256sum | cut -d' ' -f1)
          if [ "$sum" != "$BUILD_SUM" ]; then
            echo "::error::The packages artifact doesn't match the build job's checksum."
            exit 1
          fi

          # wanted <registry>: sets want=true when $PKG@$version isn't on the
          # registry yet and isn't older than the registry's latest. Answers
          # come from stdout only: npm warns on stderr (setup-node's npmrc has
          # `always-auth`, which npm 11 calls unknown), and errors are read
          # from the stderr file only when npm failed.
          err="$RUNNER_TEMP/npm-view.err"
          wanted() {
            local out latest
            want=false
            if out=$(npm view "$PKG@$version" version --registry "$1" --@n-uf:registry="$1" 2>"$err"); then
              if [ "$out" = "$version" ]; then
                echo "::notice::$PKG@$version is already on $1."
                return
              fi
              if [ -n "$out" ]; then
                echo "::error::Unexpected answer from $1 for $PKG@$version: $out"
                exit 1
              fi
            elif ! grep -qE 'E404|No match found|is not in this registry' "$err"; then
              echo "::error::Could not check $1: $(cat "$err")"
              exit 1
            fi
            if latest=$(npm view "$PKG" dist-tags.latest --registry "$1" --@n-uf:registry="$1" 2>"$err"); then
              if [ -n "$latest" ] && ! [[ "$latest" =~ ^[0-9]+\.[0-9]+\.[0-9]+[^[:space:]]*$ ]]; then
                echo "::error::Unexpected latest from $1 for $PKG: $latest"
                exit 1
              fi
              if [ "$(printf '%s\n' "$latest" "$version" | sort -V | tail -n 1)" != "$version" ]; then
                echo "::warning::$PKG@$version is older than $latest, the latest on $1, so it isn't published there."
                return
              fi
            elif ! grep -qE 'E404|is not in this registry' "$err"; then
              echo "::error::Could not check $1: $(cat "$err")"
              exit 1
            fi
            want=true
          }

          npm_list=""
          github_list=""
          for name in $PACKAGES; do
            PKG="@n-uf/$name"
            packed=$(tar -xOzf "$dir/n-uf-$name-$version.tgz" package/package.json | jq -r '.name + "@" + .version')
            if [ "$packed" != "$PKG@$version" ]; then
              echo "::error::The $name tarball holds $packed, not $PKG@$version."
              exit 1
            fi
            wanted "$NPMJS"
            if [ "$want" = true ]; then npm_list="$npm_list $name"; fi
            wanted "$GHPKG"
            if [ "$want" = true ]; then github_list="$github_list $name"; fi
          done
          echo "npm=$(xargs <<< "$npm_list")" >> "$GITHUB_OUTPUT"
          echo "github=$(xargs <<< "$github_list")" >> "$GITHUB_OUTPUT"

          # The tag and the notice belong to a run that publishes: a run that
          # publishes nothing must not tag an older version at this commit.
          if [ -n "$npm_list$github_list" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Nothing to publish at $version."
          fi
          if [ -n "$(git ls-remote --tags origin "refs/tags/v$version")" ]; then
            echo "tagged=true" >> "$GITHUB_OUTPUT"
          else
            echo "tagged=false" >> "$GITHUB_OUTPUT"
          fi

      # First, so a refusal here leaves GitHub Packages untouched (see the
      # header). No token: npm uses this job's OIDC identity; --userconfig
      # /dev/null keeps setup-node's GitHub Packages config (and its token
      # variable) out.
      - name: Publish to npmjs (trusted publishing)
        if: steps.version.outputs.npm != ''
        env:
          DIR: ${{ steps.version.outputs.dir }}
          VERSION: ${{ steps.version.outputs.version }}
          NAMES: ${{ steps.version.outputs.npm }}
          # npm logs a failed OIDC exchange only at verbose level; without it a
          # refused trusted publish shows a bare ENEEDAUTH
          NPM_CONFIG_LOGLEVEL: verbose
        run: |
          for name in $NAMES; do
            npm publish "$DIR/n-uf-$name-$VERSION.tgz" --userconfig /dev/null --access public --provenance \
              --registry "$NPMJS" --@n-uf:registry="$NPMJS"
          done

      - name: Publish to GitHub Packages
        if: steps.version.outputs.github != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIR: ${{ steps.version.outputs.dir }}
          VERSION: ${{ steps.version.outputs.version }}
          NAMES: ${{ steps.version.outputs.github }}
          # npm 11 tries OIDC on every publish; GitHub Packages uses the token
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
        run: |
          for name in $NAMES; do
            npm publish "$DIR/n-uf-$name-$VERSION.tgz" --registry "$GHPKG" --@n-uf:registry="$GHPKG"
          done

      # A run whose publishes passed but whose tag push failed publishes
      # nothing on a re-run, so it won't tag either: tag that commit by hand.
      - name: Tag
        if: steps.version.outputs.release == 'true' && steps.version.outputs.tagged == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git tag "v$VERSION"
          if ! git push origin "v$VERSION"; then
            echo "::error::Tag by hand: git tag v$VERSION $GITHUB_SHA && git push origin v$VERSION"
            exit 1
          fi

      # Once per version: when this run creates its tag. A failed notice
      # doesn't fail the release (send it by hand if it fails).
      - name: Notify pdf-n-uf (lib-released)
        if: steps.version.outputs.release == 'true' && steps.version.outputs.tagged == 'false'
        continue-on-error: true
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          if [ "$HAS_DISPATCH_TOKEN" != "true" ]; then
            echo "::notice::DISPATCH_TOKEN secret is not set; skipping the lib-released dispatch."
            exit 0
          fi
          # shellcheck disable=SC2086 # $PACKAGES is a word list
          jq -n -c --arg v "$VERSION" --arg sha "$GITHUB_SHA" --args \
            '{event_type: "lib-released", client_payload: {source: "n-uf/doodl", sha: $sha, packages: [$ARGS.positional[] | {name: ("@n-uf/" + .), version: $v}]}}' \
            $PACKAGES \
            | gh api repos/finfactory/pdf-n-uf/dispatches --method POST --input -
